site_name: "ROS 2 Labs"
site_url: https://mohamed-karim-bouafoura.github.io/ros2-labs/
site_description: Practical Robotics Labs with ROS 2.

theme:
  name: material
  icon: assets/Ros_logo.svg
  repo: fontawesome/brands/github
  font: 
    text: Source Sans Pro
    code: Source Code Pro
  palette:
    # Light Mode: Blue primary with Light Blue accent
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Dark Mode: Dark Blue primary with Light Blue accent
    - scheme: slate
      primary: indigo # indigo provides that deep 'dark blue' look in Material
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  logo: assets/Ros_logo.svg
  favicon: assets/Ros_logo.svg

  features:
    # navigation.tabs REMOVED so there is no top bar, only sidebar
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate

# Removed Tom Howard's details
copyright: "&copy; 2026 mohamed karim bouafoura."

# Update these to your own GitHub
repo_url: https://github.com/mohamed-karim-bouafoura/ros2-labs
repo_name: mohamed-karim-bouafoura.github.io/ros2-labs/

plugins:
  - search
  - awesome-pages # Automatic navigation

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
